[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"   # ваш путь к settings

# миграции аннотировать не нужно
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true
